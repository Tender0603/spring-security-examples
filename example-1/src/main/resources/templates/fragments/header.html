<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<header th:fragment="header" class="topbar">

    <div class="brand">
        <a th:href="@{/}">IOTSTAR SHOP</a>
    </div>

    <!-- Hien thi thong tin user khi da dang nhap - theo tai lieu trang 14 -->
    <div class="account" sec:authorize="isAuthenticated()">
        <span sec:authentication="name">user</span>
        <form th:action="@{/logout}"
              method="post"
              style="display:inline">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">
            <button class="link-button" type="submit">Đăng xuất</button>
        </form>
    </div>

</header>
</body>
</html>
