<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập</title>
</head>
<body>
<h2>Đăng nhập</h2>
<div th:if="${param.error}">
    <p style="color:red">Username/email hoặc password không đúng</p>
</div>
<div th:if="${param.logout}">
    <p style="color:green">Bạn đã đăng xuất</p>
</div>
<form th:action="@{/login}" method="post">
    <div>
        <label for="username">Username hoặc Email</label>
        <input id="username" type="text" name="username" placeholder="Username hoặc email" required>
    </div>
    <div>
        <label for="password">Password</label>
        <input id="password" type="password" name="password" placeholder="Password" required>
    </div>
    <button type="submit">Đăng nhập</button>
</form>
</body>
</html>
